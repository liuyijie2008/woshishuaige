<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="刘燚杰 · 电子信息工程类 · 重庆邮电大学 · 个人简历">
<title>刘燚杰 · 个人简历</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4f46e5;
    --primary-2: #06b6d4;
    --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #06b6d4 100%);
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #eef0f8;
    --text: #0f172a;
    --text-2: #3f4356;
    --muted: #69708a;
    --border: #e6e8f0;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --shadow-md: 0 10px 28px -10px rgba(15, 23, 42, .16);
    --shadow-lg: 0 24px 48px -16px rgba(15, 23, 42, .28);
    --radius: 18px;
    --radius-sm: 12px;
  }

  [data-theme="dark"] {
    --bg: #0b0e1a;
    --surface: #131827;
    --surface-2: #1b2136;
    --text: #e7eaf3;
    --text-2: #b9bdd1;
    --muted: #8b91a8;
    --border: #262c45;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .45);
    --shadow-md: 0 10px 28px -10px rgba(0, 0, 0, .65);
    --shadow-lg: 0 24px 48px -16px rgba(0, 0, 0, .8);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-image:
      radial-gradient(1100px 500px at 100% -6%, color-mix(in srgb, var(--primary) 8%, transparent), transparent 70%),
      radial-gradient(900px 500px at -10% 20%, color-mix(in srgb, var(--primary-2) 7%, transparent), transparent 70%),
      linear-gradient(color-mix(in srgb, var(--border) 44%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--border) 44%, transparent) 1px, transparent 1px);
    background-size: auto, auto, 46px 46px, 46px 46px;
    background-attachment: fixed;
  }

  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }
  a, button, .tab { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

  /* ---------- 装饰光斑 ---------- */
  .orb { position: fixed; z-index: -1; border-radius: 50%; filter: blur(90px); pointer-events: none; opacity: .5; }
  .orb-1 { width: 440px; height: 440px; background: color-mix(in srgb, var(--primary) 24%, transparent); top: -100px; right: -80px; animation: drift 16s ease-in-out infinite; }
  .orb-2 { width: 400px; height: 400px; background: color-mix(in srgb, var(--primary-2) 20%, transparent); bottom: 3%; left: -120px; animation: drift 22s ease-in-out infinite reverse; }
  @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-36px, 44px); } }

  /* ---------- 进入动画 & 滚动浮现 ---------- */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1); will-change: opacity, transform; }
  .reveal.in { opacity: 1; transform: none; }

  .hero-anim { opacity: 0; animation: heroIn .8s cubic-bezier(.16, 1, .3, 1) forwards; }
  @keyframes heroIn { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

  .hero h1 .accent { background-size: 200% 200%; animation: gradShift 6s ease infinite; }
  @keyframes gradShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .hero-card .photo, .hero-card .photo-ph { animation: floatY 7s ease-in-out infinite; }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }

  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-2); box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary-2) 55%, transparent); animation: pulse 2s infinite; display: inline-block; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary-2) 55%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* ---------- 光斑悬停 ---------- */
  .spot { position: relative; overflow: hidden; }
  .spot::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--primary) 12%, transparent), transparent 62%);
    opacity: 0; transition: opacity .35s ease;
  }
  .spot:hover::after { opacity: 1; }

  /* ---------- 导航栏 ---------- */
  .nav {
    position: fixed; inset: 0 0 auto 0; height: 64px; z-index: 60;
    display: flex; align-items: center;
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav .container { display: flex; align-items: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .5px; }
  .brand .avatar {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  }
  .brand .avatar-ph {
    display: grid; place-items: center; background: var(--grad); color: #fff;
    font-weight: 700; width: 38px; height: 38px; border-radius: 50%; font-size: 17px;
  }
  .nav-links { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .nav-links a {
    padding: 7px 13px; border-radius: 999px; font-size: 14px; color: var(--text-2);
    transition: background .18s ease, color .18s ease;
  }
  .nav-links a:hover { background: var(--surface-2); color: var(--text); }
  .nav-actions { display: flex; gap: 8px; margin-left: 6px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 44px; height: 44px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    border-radius: 50%; cursor: pointer; transition: transform .18s ease, background .18s ease, color .18s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); transform: translateY(-1px); }
  .icon-btn svg { width: 18px; height: 18px; }
  .menu-btn { display: none; }

  /* ---------- 通用节 ---------- */
  main { padding-top: 64px; }
  section { padding: 72px 0; }
  .section-head { margin-bottom: 40px; position: relative; padding-bottom: 20px; }
  .section-head::after {
    content: ""; position: absolute; left: 0; bottom: 0; width: 60px; height: 3px;
    background: var(--grad); border-radius: 3px;
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase; color: var(--primary); margin-bottom: 8px;
  }
  .kicker::before { content: ""; width: 26px; height: 3px; background: var(--grad); border-radius: 2px; }
  h2 { font-size: 30px; font-weight: 800; letter-spacing: .5px; line-height: 1.25; }
  .sec-desc { margin-top: 10px; font-size: 15px; color: var(--muted); max-width: 640px; }

  /* ---------- Hero ---------- */
  .hero { padding: 72px 0 40px; }
  .hero .container {
    display: grid; grid-template-columns: 1.35fr 1fr; gap: 48px; align-items: center;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px; border-radius: 999px;
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 24%, transparent);
    color: var(--primary); font-size: 13px; font-weight: 600; margin-bottom: 20px;
  }
  .hero h1 { font-size: 46px; line-height: 1.15; font-weight: 800; letter-spacing: .5px; }
  .hero h1 .accent {
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .subtitle { margin-top: 14px; font-size: 17px; color: var(--text-2); font-weight: 500; }
  .hero .summary { margin-top: 18px; font-size: 15px; color: var(--muted); max-width: 560px; }
  .hero .meta { margin-top: 16px; font-size: 14px; color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
  .hero .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
  .badge {
    padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
    transition: transform .18s ease, border-color .18s ease;
  }
  .badge:hover { transform: translateY(-2px); border-color: var(--primary); }
  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease; white-space: nowrap;
  }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--primary) 70%, transparent); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -10px color-mix(in srgb, var(--primary) 80%, transparent); }
  .btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text-2); }
  .btn-ghost:hover { transform: translateY(-2px); border-color: var(--primary); color: var(--text); }

  .hero-card {
    position: relative; border-radius: 24px; padding: 34px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .hero-card .photo {
    width: 132px; height: 132px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px;
    border: 4px solid #fff; box-shadow: 0 0 0 1px var(--border), 0 14px 30px -12px var(--primary);
  }
  .hero-card .photo-ph {
    width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px;
    background: var(--grad); color: #fff; font-size: 44px; font-weight: 800;
    box-shadow: 0 14px 30px -12px var(--primary);
  }
  .hero-card h3 { font-size: 20px; font-weight: 800; }
  .hero-card p { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .hero-card .mini-stats { display: flex; justify-content: center; gap: 22px; margin-top: 20px; }
  .hero-card .mini-stats div b { display: block; font-size: 20px; font-weight: 800; }
  .hero-card .mini-stats div span { font-size: 12px; color: var(--muted); }

  /* ---------- 亮点 ---------- */
  .highlights-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 18px; text-align: center; transition: transform .2s ease, box-shadow .2s ease;
  }
  .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
  .stat-card .value {
    font-size: 30px; font-weight: 800; background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2;
  }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* ---------- 关于我 & 时间线 ---------- */
  .about-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 24px; align-items: start; }
  .about-card {
    border-radius: var(--radius); padding: 32px; border: 1px solid var(--border);
    background: var(--grad); color: #fff; box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
  }
  .about-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(500px circle at 85% 10%, rgba(255,255,255,.18), transparent 55%); }
  .about-card .q { position: relative; z-index: 1; font-size: 16px; line-height: 1.9; }
  .about-card .q::before { content: "“"; font-size: 56px; line-height: 1; display: block; opacity: .5; font-family: Georgia, serif; }
  .about-card .traits { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .about-card .trait { font-size: 12.5px; padding: 6px 13px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); }
  .about-card .hob-label { position: relative; z-index: 1; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,.75); margin: 20px 0 8px; }

  .timeline { position: relative; display: grid; gap: 16px; padding-left: 26px; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--primary), var(--primary-2)); opacity: .35; }
  .tl-item { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; box-shadow: var(--shadow-sm); transition: transform .2s ease, box-shadow .2s ease; }
  .tl-item:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
  .tl-item::before { content: ""; position: absolute; left: -24px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
  .tl-item.done::before { background: var(--primary-2); }
  .tl-item .tl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tl-item .tl-time { font-size: 12.5px; font-weight: 700; color: var(--primary); letter-spacing: .5px; }
  .tl-item .tl-title { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .tl-item .tl-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .tl-status { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .tl-status.done { background: color-mix(in srgb, var(--primary-2) 15%, transparent); color: var(--primary-2); }
  .tl-status.progress { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .tab {
    padding: 10px 18px; border: none; background: transparent; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--muted); border-radius: 10px 10px 0 0;
    position: relative; transition: color .18s ease;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--primary); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: -5px; height: 3px;
    background: var(--grad); border-radius: 3px;
  }
  .tab-panel { display: none; }
  .tab-panel.is-active { display: block; animation: fade .3s ease; }

  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .exp-card {
    position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 28px 28px 32px; box-shadow: var(--shadow-sm);
  }
  .exp-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grad); }
  .exp-card .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .exp-card .org { font-size: 19px; font-weight: 800; }
  .exp-card .role { font-size: 14px; color: var(--muted); }
  .exp-card .period { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .exp-card ul { margin-top: 16px; display: grid; gap: 11px; }
  .exp-card li { position: relative; padding-left: 22px; color: var(--text-2); font-size: 14.5px; }
  .exp-card li::before {
    content: ""; position: absolute; left: 4px; top: 9px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--grad);
  }
  .exp-card li b { color: var(--text); }

  /* ---------- 项目卡片 ---------- */
  .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card {
    position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow-sm); overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--grad); transform: scaleX(0); transform-origin: left; transition: transform .3s ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
  .card:hover::before { transform: scaleX(1); }
  .card .card-type {
    align-self: flex-start; font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--primary); padding: 4px 11px; border-radius: 999px;
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
  }
  .card h3 { font-size: 18px; font-weight: 800; margin-top: 8px; }
  .card .card-period { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card ul { margin-top: 14px; display: grid; gap: 9px; flex: 1; }
  .card li { font-size: 13.5px; color: var(--text-2); padding-left: 16px; position: relative; }
  .card li::before { content: "·"; position: absolute; left: 4px; color: var(--primary); font-weight: 800; }
  .tech-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
  .tech { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
  .card-link { margin-top: 16px; font-size: 13.5px; font-weight: 600; color: var(--primary); display: inline-flex; align-items: center; gap: 5px; }
  .card-link:hover { text-decoration: underline; }

  /* ---------- 技能矩阵 ---------- */
  .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .skill-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .skill-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .skill-card h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--grad); }
  .skill-badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-badge {
    font-size: 13px; padding: 6px 13px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-2); transition: transform .16s ease, border-color .16s ease;
  }
  .skill-badge:hover { transform: translateY(-2px); border-color: var(--primary); }
  .skill-badge.hot { border-color: color-mix(in srgb, var(--primary) 40%, transparent); color: var(--primary); }

  /* ---------- 教育 & 证书 ---------- */
  .edu-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
  .edu-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
  .edu-card .school { font-size: 20px; font-weight: 800; }
  .edu-card .dept { color: var(--text-2); font-size: 14px; margin-top: 4px; }
  .edu-card .edu-period { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--primary); font-weight: 600; }
  .edu-card ul { margin-top: 16px; display: grid; gap: 10px; }
  .edu-card li { font-size: 14px; color: var(--text-2); padding-left: 20px; position: relative; }
  .edu-card li::before { content: "›"; position: absolute; left: 4px; color: var(--primary); font-weight: 800; }

  .certs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .cert-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cert-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
  .cert-card .cert-img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; cursor: zoom-in; background: var(--surface-2); display: block; }
  .cert-card .cert-img-ph {
    width: 100%; aspect-ratio: 16 / 10; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 13px;
  }
  .cert-card .cert-body { padding: 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cert-card .cert-title { font-size: 15.5px; font-weight: 800; }
  .cert-card .cert-org { font-size: 13px; color: var(--muted); }
  .cert-card .cert-date { font-size: 12.5px; color: var(--primary); font-weight: 600; }

  /* ---------- 页脚 ---------- */
  footer { padding: 36px 0 48px; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: 13.5px; }
  footer a { color: var(--primary); }

  /* ---------- 返回顶部 / 灯箱 ---------- */
  .back-top {
    position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px; border-radius: 50%;
    background: var(--grad); color: #fff; border: none; cursor: pointer; box-shadow: var(--shadow-lg);
    display: grid; place-items: center; opacity: 0; pointer-events: none; transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease; z-index: 55;
  }
  .back-top.show { opacity: 1; pointer-events: auto; transform: none; }
  .back-top svg { width: 20px; height: 20px; }

  .lightbox {
    position: fixed; inset: 0; z-index: 100; background: rgba(8, 10, 20, .82);
    display: grid; place-items: center; padding: 28px; backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }

/* ============ 工具 ============ */
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, children = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === "") continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
};

const svg = (paths, viewBox = "0 0 24 24") => {
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", viewBox); s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  [].concat(paths).forEach((d) => {
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", d); s.appendChild(p);
  });
  return s;
};

/* ============ 图片加载（多候选 + 兜底） ============ */
function loadImage(img, sources, alt, onFinalFail) {
  let i = 0;
  img.alt = alt;
  img.onerror = () => {
    i += 1;
    if (i < sources.length) { img.src = sources[i]; }
    else if (onFinalFail) { onFinalFail(); }
  };
  img.src = sources[0];
}

/* ============ Tabs（ARIA + 键盘） ============ */
function setupTabs(tablist, tabs, panels) {
  function select(idx) {
    tabs.forEach((t, i) => {
      const on = i === idx;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      panels.children[i].classList.toggle("is-active", on);
    });
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => select(i));
    t.addEventListener("keydown", (e) => {
      let n = null;
      if (e.key === "ArrowRight") n = (i + 1) % tabs.length;
      else if (e.key === "ArrowLeft") n = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === "Home") n = 0;
      else if (e.key === "End") n = tabs.length - 1;
      if (n != null) { e.preventDefault(); tabs[n].focus(); select(n); }
    });
  });
}

/* ============ 邮箱复制（防爬虫拼接） ============ */
function fullEmail() {
  return resume.contact.emailUser + "@" + resume.contact.emailDomain;
}
function copyEmail() {
  $("#mailText").textContent = fullEmail();
  const done = async () => {
    try { await navigator.clipboard.writeText(fullEmail()); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = fullEmail(); document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    $("#heroCtns").querySelectorAll(".btn-ghost")[0].lastChild.textContent = " 已复制 ✓";
    setTimeout(() => { $("#heroCtns").querySelectorAll(".btn-ghost")[0].lastChild.textContent = " 复制"; }, 1600);
  };
  done();
}

/* ============ 主题切换 ============ */
function themeIcon() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const btn = $("#themeToggle");
  btn.innerHTML = "";
  btn.append(dark ? svg(ICONS.sun) : svg(ICONS.moon));
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
  themeIcon();
}
function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved) { document.documentElement.setAttribute("data-theme", saved); }
  else {
    const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }
  themeIcon();
  $("#themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  });
}

/* ============ 滚动浮现 & 数字动画 & 光斑 ============ */
function countStat(card) {
  const val = card.querySelector('.value[data-target]');
  if (!val) return;
  const end = parseInt(val.getAttribute('data-target'), 10);
  const suffix = val.getAttribute('data-suffix') || '';
  val.removeAttribute('data-target');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { val.textContent = end + suffix; return; }
  const dur = 900; const t0 = performance.now();
  const step = (now) => {
    const p = Math.min((now - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    val.textContent = Math.round(end * eased) + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function initReveal() {
  document.querySelectorAll('.section-head').forEach((n) => n.classList.add('reveal'));
  const nodes = Array.from(document.querySelectorAll('.reveal'));
  if (!('IntersectionObserver' in window)) { nodes.forEach((n) => n.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      if (e.target.classList.contains('stat-card')) countStat(e.target);
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -30px 0px" });
  nodes.forEach((n) => {
    const siblings = n.parentNode ? Array.prototype.indexOf.call(n.parentNode.children, n) : 0;
    n.style.transitionDelay = Math.min(siblings, 5) * 70 + 'ms';
    io.observe(n);
  });
}

function initSpotlight() {
  document.querySelectorAll('.card, .stat-card, .cert-card, .skill-card, .edu-card, .exp-card, .tl-item')
    .forEach((c) => c.classList.add('spot'));
  document.querySelectorAll('.spot').forEach((c) => {
    c.addEventListener('pointermove', (e) => {
      const r = c.getBoundingClientRect();
      c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      c.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

function initHeroAnim() {
  const ids = ['heroBadge', 'heroName', 'heroSubtitle', 'heroSummary', 'heroMeta', 'heroBadges', 'heroCtns'];
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { ids.forEach((id) => { const n = document.getElementById(id); n.style.opacity = 1; }); return; }
  ids.forEach((id, i) => {
    const n = document.getElementById(id);
    n.classList.add('hero-anim');
    n.style.animationDelay = (i * 70) + 'ms';
  });
  const hc = document.getElementById('heroCard');
  hc.classList.add('hero-anim');
  hc.style.animationDelay = '240ms';
}

  const btn = $("#menuToggle");

  btn.addEventListener("click", () => {
    const open = links.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));

    if (e.target.tagName === "A") { links.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }

}
function initBackTop() {
  const btn = $("#backTop");
  btn.innerHTML = "";
  btn.append(svg(ICONS.arrowUp));
  window.addEventListener("scroll", () => {
    btn.classList.toggle("show", window.scrollY > 600);
  }, { passive: true });
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
}
const lightbox = $("#lightbox");
const lbImg = $("#lbImg");
function openLightbox(src, alt) {
  lbImg.src = src; lbImg.alt = alt;
  lightbox.classList.add("open");
}
function closeLightbox() { lightbox.classList.remove("open"); }
function initLightbox() {
  $("#lbClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
}
